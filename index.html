<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creador de pósters de fútbol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Ops+One&family=Bangers&family=Russo+One&family=Metal+Mania&family=Racing+Sans+One&family=Kaushan+Script&family=Permanent+Marker&display=swap">
<style>
:root{--bg:#020a22;--card:rgba(10,24,70,.78);--tx:#eaf2ff;--mut:#9db4e0;--bd:rgba(125,175,255,.28);--ac:#38bdf8;--g1:#0a2a7a;--g2:#04133f;--g3:#020a22;--glow:rgba(40,110,255,.55);--tc:#8fd3ff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-tema=verde]{--bg:#021a0c;--g1:#0b5d2e;--g2:#053a1c;--g3:#021a0c;--glow:rgba(34,197,94,.5);--tc:#9bf0b4;--ac:#4ade80;--card:rgba(6,45,24,.8);--bd:rgba(120,230,160,.28);--mut:#9fd4b0}
:root[data-tema=naranja]{--bg:#1a0804;--g1:#9a3412;--g2:#4a1708;--g3:#1a0804;--glow:rgba(249,115,22,.5);--tc:#ffc08a;--ac:#fb923c;--card:rgba(66,24,8,.8);--bd:rgba(255,170,110,.28);--mut:#e0b393}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:16px 0 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input[type=text],input[type=date],input[type=time],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=range]{width:100%;accent-color:var(--ac)}
textarea{resize:vertical;min-height:54px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.match{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:10px}
input[type=color]{width:100%;height:38px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:2px}
input[type=file]{width:100%;font-size:12px;color:var(--mut)}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:16px;font-family:inherit;cursor:pointer}
button.sec{background:var(--bd);color:var(--tx);margin-top:0;padding:8px}
main{max-width:1100px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.row>*{min-width:0}
.prev{order:-1;position:sticky;top:8px;z-index:5;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.prev.nofix{position:static}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:13px;color:var(--mut)}
.ph label{display:flex;align-items:center;gap:5px;margin:0;white-space:nowrap}
.ph input[type=range]{flex:1;min-width:0}
.ph button{width:auto;margin:0;padding:7px 14px;font-size:14px}
canvas{display:block;margin:0 auto;width:auto;height:auto;max-width:100%;max-height:calc(var(--pv,40)*1vh);border-radius:10px}
@media(min-width:860px){main{display:grid;grid-template-columns:380px 1fr;align-items:start;gap:16px;padding:16px}.prev{order:0;top:16px}canvas{max-height:calc(100vh - 90px)}.ph input[type=range]{display:none}.ph{justify-content:space-between}}
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#out{max-width:100%;max-height:76vh;width:auto;height:auto;border-radius:10px}
#modal p{color:#cfd6df;font-size:14px;margin:0;text-align:center}
.mb{display:flex;gap:10px;width:100%;max-width:420px}
.mb a,.mb button{flex:1;margin:0;padding:12px;border-radius:10px;border:0;font:600 16px system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.mb a{background:var(--ac);color:#fff}
.mb button{background:#3a4352;color:#fff}
html{-webkit-text-size-adjust:100%}
#gal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#gal button{padding:0;margin:0;border:3px solid transparent;border-radius:8px;overflow:hidden;background:var(--bd);aspect-ratio:4/5;width:100%}
#gal button.on{border-color:var(--ac)}
#gal img{width:100%;height:100%;object-fit:cover;display:block}

body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% -10%,var(--glow),transparent 60%),repeating-linear-gradient(105deg,rgba(150,190,255,.07) 0 2px,transparent 2px 46px),linear-gradient(180deg,var(--g1) 0%,var(--g2) 40%,var(--g3) 100%)}
body::after{content:"";position:fixed;left:50%;top:55%;width:min(90vw,700px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(150,190,255,.07);border-radius:50%;z-index:-1;pointer-events:none}
.hero{text-align:center;padding:20px 16px 22px;border-bottom:4px solid #ffc83d;border-radius:0 0 28px 28px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.12));box-shadow:0 8px 30px rgba(0,0,0,.35)}
.hero small{display:block;color:#ffc83d;letter-spacing:.3em;font-size:12px;font-weight:700}
.hero h1{margin:6px 0 4px;font:400 clamp(34px,9vw,60px)/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.03em;color:var(--tc);text-shadow:0 0 18px var(--glow),0 0 42px var(--glow)}
.hero p{margin:0;color:#dbe8ff;font-size:14px}
.dots{display:flex;gap:10px;justify-content:center;margin-top:12px}
.dots button{width:30px;height:30px;padding:0;margin:0;border-radius:50%;border:3px solid transparent;box-shadow:none}
.dots button[data-t=azul]{background:#2563eb}.dots button[data-t=verde]{background:#16a34a}.dots button[data-t=naranja]{background:#ea580c}
.dots button.on{border-color:#fff}
.card{background:var(--card);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:16px}
.prev{background:rgba(5,14,46,.94)}
h2{font:400 22px/1.1 "Bebas Neue",Impact,sans-serif;letter-spacing:.06em;color:var(--tc);margin:22px 0 4px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#ffc83d,transparent)}
input[type=text],input[type=date],input[type=time],textarea,select{background:rgba(2,10,34,.7);border-color:var(--bd)}
input[type=range]{accent-color:var(--ac)}
button{background:var(--ac);color:#04133f;box-shadow:0 6px 18px rgba(0,0,0,.35)}
button.sec{background:rgba(255,255,255,.12);color:var(--tx);box-shadow:none}
#gen,#gen2{background:linear-gradient(180deg,#ffd45c,#f59e0b);color:#2b1a00}
.mb a{background:linear-gradient(180deg,#ffd45c,#f59e0b);color:#2b1a00}
.mb button{background:#3a4352;color:#fff}
#gal button.on{border-color:#ffc83d}
</style>
</head>
<body>
<header class="hero"><small>⚡ FÚTBOL ⚡</small><h1>CREADOR DE PÓSTERS</h1><p>Diseña el afiche de tu partido y descárgalo en segundos</p>
<div class="dots"><button type="button" data-t="azul" class="on" title="Azul"></button><button type="button" data-t="verde" title="Verde"></button><button type="button" data-t="naranja" title="Naranja"></button></div></header>
<main>
<section class="card">
<h2>Título</h2>
<label>Línea 1 (grande)</label><input type="text" id="t1" value="COPA RELÁMPAGO">
<label>Línea 2 (destacada)</label><input type="text" id="t2" value="IN MEMORIAM">
<label>Línea 3 (pequeña)</label><input type="text" id="t3" value="Ricardo Noriel Martínez “Richy”">
<label>Cinta (ej. 3ER ENCUENTRO, FINAL, JORNADA 2)</label><input type="text" id="cinta" value="3ER ENCUENTRO">
<h2>Equipos (hasta 4 por lado)</h2>
<div id="matches"></div>
<button type="button" class="sec" id="add" style="margin-top:10px">+ Agregar equipos</button>
<h2>Fecha, hora y lugar</h2>
<div class="row"><div><label>Fecha</label><input type="date" id="fecha"></div><div><label>Hora</label><input type="time" id="hora" value="10:30"></div></div>
<div class="row"><div><label>Texto antes de la hora</label><input type="text" id="pref" value="Desde"></div><div><label>Texto antes del lugar</label><input type="text" id="etq" value="Cuadro"></div></div>
<div class="row"><div><label>Lugar</label><input type="text" id="lugar" value="P. Velásquez #1"></div><div><label>Lugar (línea 2)</label><input type="text" id="lugar2" value="El panti"></div></div>
<h2>Lema y patrocinadores</h2>
<label>Lema</label><input type="text" id="lema" value="“El fútbol nos une, la memoria nos mantiene juntos”">
<label>Letra del lema</label><select id="fuenteLema"><option value='"Kaushan Script",cursive'>Pincel (Kaushan)</option><option value='"Permanent Marker",cursive'>Marcador</option><option value='"Anton",Impact,sans-serif'>Anton</option></select>
<label>Patrocinadores (opcional)</label><textarea id="spons"></textarea>
<h2>Letras y efectos</h2>
<div class="row"><div><label>Fuente</label><select id="fuente"><option>Anton</option><option>Bebas Neue</option><option>Black Ops One</option><option>Bangers</option><option>Russo One</option><option>Metal Mania</option><option>Racing Sans One</option></select></div>
<div><label>Efecto línea 1 y VS</label><select id="efecto"><option value="cromo">Cromo metálico</option><option value="3d">Relieve 3D</option><option value="oro">Oro brillante</option><option value="fuego">Fuego</option><option value="hielo">Hielo</option><option value="neon">Neón</option><option value="lima">Lima eléctrico</option></select></div></div>
<label>Efecto línea 2</label><select id="efecto2"><option value="lima">Lima eléctrico</option><option value="cromo">Cromo metálico</option><option value="3d">Relieve 3D</option><option value="oro">Oro brillante</option><option value="fuego">Fuego</option><option value="hielo">Hielo</option><option value="neon">Neón</option></select>
<h2>Tamaños y detalles</h2>
<label>Escudos</label><input type="range" id="sLogo" min="50" max="120" value="100">
<label>Nombres sobre los escudos</label><input type="range" id="sName" min="60" max="180" value="100">
<label>Título</label><input type="range" id="sTit" min="70" max="130" value="100">
<label>Forma de los escudos</label><select id="forma"><option value="cuadro">Cuadro con marco</option><option value="circulo">Círculo</option><option value="libre">Libre, sin marco</option></select>
<label><input type="checkbox" id="oNames"> Mostrar nombres sobre los escudos</label>
<label><input type="checkbox" id="oBall" checked> Balón</label>
<label><input type="checkbox" id="oStreak" checked> Destellos de energía</label>
<h2>Fondo</h2>
<select id="fondo"><option value="relampago">Estadio relámpago</option><option value="clasico">Césped clásico</option><option value="estadio">Estadio de noche</option><option value="fuego">Fuego y brasas</option><option value="neon">Neón retro</option><option value="tormenta">Tormenta eléctrica</option><option value="oro">Oro y gloria</option><option value="foto">Mi propia foto</option></select>
<label>Foto de fondo (para la opción “Mi propia foto”)</label>
<label id="galt" style="display:none">Fondos predeterminados (toca uno)</label>
<div id="gal"></div>
<label>Subir mi propia foto</label>
<input type="file" id="foto" accept="image/*">
<label>Oscurecer foto de fondo</label><input type="range" id="osc" min="0" max="100" value="40">
<div class="row"><div><label>Principal</label><input type="color" id="c1"></div><div><label>Oscuro</label><input type="color" id="c2"></div></div>
<label>Acento</label><input type="color" id="c3">
<button id="gen">Crear imagen para guardar</button>
</section>
<section class="card prev" id="prev">
<div class="ph"><label><input type="checkbox" id="fijar" checked> Fijar</label><input type="range" id="pv" min="20" max="70" value="40" title="Tamaño de la vista previa"><button type="button" id="gen2">Guardar</button></div>
<canvas id="cv" width="1080" height="1350"></canvas>
</section>
</main>
<div id="modal"><p>Mantén presionada la imagen para guardarla, o toca Descargar.</p><img id="out" alt="Póster listo"><div class="mb"><a id="dl" download="poster-futbol.png">Descargar</a><button type="button" id="cl">Cerrar</button></div></div>
<script src="app.js"></script>
</body>
</html>
